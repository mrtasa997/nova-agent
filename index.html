<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>NOVA Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
  header { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; }
  h1 { color: #58a6ff; font-size: 20px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; white-space: pre-wrap; line-height: 1.6; }
  .user { background: #1f6feb; color: white; margin-right: auto; }
  .bot { background: #161b22; border: 1px solid #30363d; margin-left: auto; }
  .logs { background: #0d1117; border: 1px dashed #30363d; padding: 8px; font-family: monospace; font-size: 12px; color: #7ee787; margin-top: 8px; border-radius: 6px; }
  #input-area { display: flex; padding: 15px; background: #161b22; gap: 10px; border-top: 1px solid #30363d; }
  #msg { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 15px; }
  button { padding: 12px 24px; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
  button:hover { background: #2ea043; }
  button:disabled { background: #555; cursor: not-allowed; }
</style>
</head>
<body>
<header><h1>NOVA Agent - مساعدك البرمجي</h1></header>
<div id="chat">
  <div class="msg bot">هلا! اطلب مني أي برنامج أو لعبة وأنا راح أكتبها، أشغلها، وأصلح أخطائي بنفسي</div>
</div>
<div id="input-area">
  <input id="msg" placeholder="مثلا: سوي لي لعبة Snake" autofocus>
  <button id="btn" onclick="send()">إرسال</button>
</div>
<script>
function addMsg(role, text) {
  var chat = document.getElementById('chat');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  var input = document.getElementById('msg');
  var btn = document.getElementById('btn');
  var text = input.value.trim();
  if (!text) return;
  
  addMsg('user', text);
  input.value = '';
  btn.disabled = true;
  btn.textContent = '... يفكر';
  var loading = addMsg('bot', 'الـ Agent يفكر...');
  
  try {
    var res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    var data = await res.json();
    loading.remove();
    
    var finalMsg = addMsg('bot', data.reply);
    
    if (data.logs && data.logs.length) {
      var logsDiv = document.createElement('div');
      logsDiv.className = 'logs';
      logsDiv.textContent = data.logs.join('\n');
      finalMsg.appendChild(logsDiv);
    }
  } catch(e) {
    loading.remove();
    addMsg('bot', 'خطأ: ' + e.message);
  }
  
  btn.disabled = false;
  btn.textContent = 'إرسال';
  document.getElementById('msg').focus();
}

document.getElementById('msg').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
