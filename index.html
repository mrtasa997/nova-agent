<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
  header { background: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
  h1 { color: #58a6ff; font-size: 18px; }
  .download-btn { background: #238636; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; }
  .download-btn:hover { background: #2ea043; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; white-space: pre-wrap; line-height: 1.7; word-wrap: break-word; }
  .user { background: #1f6feb; color: white; margin-right: auto; }
  .bot { background: #161b22; border: 1px solid #30363d; margin-left: auto; }
  .logs { background: #0d1117; border: 1px dashed #30363d; padding: 8px; font-family: monospace; font-size: 12px; color: #7ee787; margin-top: 8px; border-radius: 6px; max-height: 200px; overflow-y: auto; }
  #input-area { display: flex; padding: 15px; background: #161b22; gap: 10px; border-top: 1px solid #30363d; align-items: center; }
  #msg { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 15px; }
  button { padding: 12px 20px; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:hover { background: #2ea043; }
  button:disabled { background: #555; cursor: not-allowed; }
  .upload-label { padding: 12px; background: #21262d; border: 1px solid #30363d; border-radius: 8px; cursor: pointer; color: #c9d1d9; }
  .upload-label:hover { background: #30363d; }
  #fileInput { display: none; }
  .file-badge { background: #21262d; color: #58a6ff; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-top: 6px; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>🤖 NOVA Agent — مساعدك الذكي الشامل</h1>
  <a href="/download/project.zip" class="download-btn">📥 تحميل المشروع</a>
</header>
<div id="chat">
  <div class="msg bot">هلا! أنا NOVA، مساعدك الذكي. أقدر:
• أجاوب على أي سؤال
• أكتب كود بأي لغة برمجة
• أبني تطبيقات وألعاب
• أرفع ملفاتك وأعدلها
• أترجم وألخص وأحلل
اطلب أي شي! 🚀</div>
</div>
<div id="input-area">
  <label class="upload-label" for="fileInput">📎</label>
  <input type="file" id="fileInput">
  <input id="msg" placeholder="اكتب طلبك..." autofocus>
  <button id="btn" onclick="send()">إرسال</button>
</div>
<script>
function addMsg(role, text) {
  var chat = document.getElementById('chat');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function uploadFile(file) {
  var fd = new FormData();
  fd.append('file', file);
  try {
    var res = await fetch('/upload', { method: 'POST', body: fd });
    var data = await res.json();
    addMsg('user', '📎 رفعت ملف: ' + file.name);
    addMsg('bot', data.message + '\nتقدر تطلب مني أعدله أو أحلله.');
  } catch(e) {
    addMsg('bot', 'فشل الرفع: ' + e.message);
  }
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  if (e.target.files.length) {
    uploadFile(e.target.files[0]);
    e.target.value = '';
  }
});

async function send() {
  var input = document.getElementById('msg');
  var btn = document.getElementById('btn');
  var text = input.value.trim();
  if (!text) return;
  
  addMsg('user', text);
  input.value = '';
  btn.disabled = true;
  btn.textContent = '... يفكر';
  var loading = addMsg('bot', 'يفكر...');
  
  try {
    var res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    var data = await res.json();
    loading.remove();
    
    var finalMsg = addMsg('bot', data.reply);
    
    if (data.logs && data.logs.length) {
      var logsDiv = document.createElement('div');
      logsDiv.className = 'logs';
      logsDiv.textContent = data.logs.join('\n');
      finalMsg.appendChild(logsDiv);
    }
  } catch(e) {
    loading.remove();
    addMsg('bot', 'خطأ: ' + e.message);
  }
  
  btn.disabled = false;
  btn.textContent = 'إرسال';
  document.getElementById('msg').focus();
}

document.getElementById('msg').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
